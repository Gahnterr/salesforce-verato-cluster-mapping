<template>
    <div class="slds-grid slds-grid_vertical-align-start slds-gutters_small slds-m-bottom_small">
        <div class="slds-col">
            <lightning-radio-group
                class="direction-radio-group"
                label="Direction"
                type="button"
                options={directionOptions}
                value={mapping.direction}
                onchange={handleDirection}>
            </lightning-radio-group>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">{directionHelp}</p>
        </div>
    </div>
    <hr></hr>
    <div class="slds-m-bottom_medium">
        <ui-cluster-child-object-form mapping={mapping} onmappingchange={handleChildObject}></ui-cluster-child-object-form>
    </div>
    <hr></hr>
    <ui-cluster-attribute-mapping
        attributes={attributes}
        mapped={mapping.attributes}
        groups={mapping.groups}
        order={mapping.order}
        direction={mapping.direction}
        issues={issues}
        onattributeschange={handleAttributes}>
    </ui-cluster-attribute-mapping>
</template>
