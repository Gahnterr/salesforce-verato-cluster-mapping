<template>
    <div>
        <ui-page-header
            variant="record-home"
            icon-name="standard:recent"
            title="Log"
            show-subtitle
            show-middle>
            <span slot="subtitle">{eventCountText}</span>
            <div slot="middle" class="c-kpis">
                <template for:each={statusCards} for:item="card">
                    <button
                        key={card.value}
                        type="button"
                        class={card.className}
                        aria-pressed={card.isActive}
                        title={card.title}
                        data-status={card.value}
                        onclick={handleStatusCard}>
                        <span class="c-kpi__label">
                            <lightning-icon class={card.iconClass} icon-name={card.iconName} size={card.iconSize} alternative-text=""></lightning-icon>
                            <span class="c-kpi__name">{card.label}</span>
                        </span>
                        <span class="c-kpi__count">{card.count}</span>
                    </button>
                </template>
            </div>
            <div slot="actions" class="slds-grid slds-grid_vertical slds-grid_vertical-align-end">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    variant="border-filled"
                    alternative-text="Refresh history"
                    title="Refresh history"
                    onclick={refresh}>
                </lightning-button-icon>
                <ui-relative-time
                    class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
                    prefix="Last updated"
                    timestamp={lastUpdated}>
                </ui-relative-time>
            </div>
        </ui-page-header>

        <div class="c-layout">
            <ui-history-filters
                filters={filters}
                source-options={sourceOptions}
                cluster-options={clusterOptions}
                onfilterchange={handleFilterChange}>
            </ui-history-filters>
            <div class="c-results">
                <ui-history-table
                    key-field="id"
                    data={rows}
                    columns={columns}
                    hide-checkbox-column>
                </ui-history-table>
                <ui-empty-state lwc:if={hasNoRows} title="No events match these filters."></ui-empty-state>
            </div>
        </div>
    </div>
</template>
